<style>
:root{--p:#e3141b;--p2:#ff4d4f;--bg:#f4f6f8;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--red:#dc2626;--grn:#16a34a;--amb:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;border-radius:8px;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 50px)}
nav{width:210px;background:#fff;border-left:1px solid var(--bd);padding:8px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--p);color:#fff}
nav a:hover:not(.on){background:#fff1f1}
main{flex:1;padding:16px;max-width:1200px;overflow-x:hidden}
@media(max-width:800px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--bd);position:sticky;top:50px;z-index:4}nav a{white-space:nowrap;margin:0 2px}main{padding:10px}}
h2{margin:4px 0 14px;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card .l{color:var(--mu);font-size:13px}.card .v{font-size:20px;font-weight:700;margin-top:4px}
.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:#f9fafb;color:var(--mu);font-weight:600}
.btn{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.btn.s{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.d{background:var(--red)}
.btn.x{padding:4px 8px;font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.neg{color:var(--red)}.pos{color:var(--grn)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#e0f2fe;color:#075985}
.tag.r{background:#fee2e2;color:#991b1b}.tag.g{background:#dcfce7;color:#166534}.tag.a{background:#fef3c7;color:#92400e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:20px 10px;overflow-y:auto}
.mbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:640px}
.mbox h3{margin:0 0 12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
.f label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:14px}
.f.full{grid-column:1/-1}
.lines td{padding:4px}.lines input,.lines select{width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;font-family:inherit}
.tot{font-weight:700;font-size:16px;margin-top:8px}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub a{padding:6px 12px;border-radius:20px;background:#fff;border:1px solid var(--bd);cursor:pointer}
.sub a.on{background:var(--p);color:#fff;border-color:var(--p)}
.muted{color:var(--mu);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{padding:6px;border:1px solid var(--bd);border-radius:8px;font-family:inherit}
.login-bg{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url('https://images.unsplash.com/photo-1758573951451-a6d625f124de?fm=jpg&q=70&w=1800&auto=format&fit=crop') center/cover no-repeat,#3b2a1e!important}
.login-bg .mbox{background:rgba(255,255,255,.9);backdrop-filter:blur(6px)}
@media print{nav,header,.btn,.filters{display:none!important}main{padding:0}}
</style>
</head>

async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(args)});

  return j;
}

const custodyOpen=c=>n(c.amt)-S.settle.filter(s=>s.cid===c.id).reduce((a,s)=>a+n(s.spent)+n(s.ret),0);
function monthsBetween(a,b){const x=new Date(a),y=new Date(b);return Math.max(0,(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth()))}
const depMonthly=m=>n(m.life)>0?(n(m.cost)-n(m.salvage))/(n(m.life)*12):0;
function depAccum(m,to=today()){return Math.min(n(m.cost)-n(m.salvage),depMonthly(m)*monthsBetween(m.date,to))}
function depInPeriod(m,from,to){return Math.max(0,depAccum(m,to)-depAccum(m,from))}

// ================== UI HELPERS ==================
const PAGES=[['dash','📊 لوحة التحكم'],['sales','🧾 المبيعات'],['purch','🛒 المشتريات'],['prod','🏭 الإنتاج'],['items','👟 المنتجات والخامات'],['stock','📦 المخزن'],['cash','💰 الخزنة والبنك'],['cust','🤝 العُهد'],['mach','⚙️ الآلات'],['parties','👥 العملاء والموردين'],['reports','📈 التقارير']];
let cur='dash',sub={};
function go(p){if(!allowed(p))return;cur=p;render()}
function render(){
  if(!U||!S)return;
  if(!allowed(cur))cur='account';
  const pg=PAGES.filter(([k])=>allowed(k)).concat(isAdmin()?[['users','🔐 المستخدمين'],['settings','💾 النسخ الاحتياطي']]:[]);
  document.getElementById('nav').innerHTML=pg.map(([k,l])=>`<a class="${k===cur?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
  document.getElementById('main').innerHTML=(V[cur]||V.dash)();
}
function table(heads,rows,empty='لا توجد بيانات'){
  return `<div class="tw"><table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="muted">${empty}</td></tr>`}</table></div>`;
}
const opts=(arr,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+S[arr].map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
const accOpts=sel=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} (${a.type==='cash'?'خزنة':'بنك'})</option>`).join('');
function closeM(){document.getElementById('modal').innerHTML=''}
function modal(title,body,onok,okText='حفظ'){
  document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="mbox"><h3>${title}</h3><form id="mf">${body}<div class="bar" style="margin-top:14px"><button class="btn" type="submit">${okText}</button><button class="btn s" type="button" onclick="closeM()">إلغاء</button></div></form></div></div>`;
  lastAction=title.replace(/<[^>]*>/g,'');
  document.getElementById('mf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(onok(d,e.target)!==false){save();closeM();render()}};
}
const fld=(name,label,type='text',val='',extra='')=>`<div class="f ${type==='textarea'?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea name="${name}" rows="2">${esc(val)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(val)}" ${type==='number'?'step="any"':''} ${extra}></div>`}`;
const sel=(name,label,options,extra='')=>`<div class="f"><label>${label}</label><select name="${name}" ${extra}>${options}</select></div>`;
function del(arr,id,also){if(!confirm('تأكيد الحذف؟ سيتم حذف الحركات المرتبطة أيضاً.'))return;lastAction='حذف من '+arr+': '+(by(arr,id).name||by(arr,id).no||by(arr,id).date||'');S[arr]=S[arr].filter(x=>x.id!==id);if(also)also();save();render()}
const unlinkRef=ref=>{S.moves=S.moves.filter(m=>m.ref!==ref);S.txns=S.txns.filter(t=>t.ref!==ref)};

// line editor for invoices
function linesEditor(kind){ // kind: 'prod' or 'mat'
  const arr=kind==='prod'?'products':'materials';
  return `<div class="f full"><label>الأصناف</label><div class="tw"><table class="lines" id="ln"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></table></div>
  <button type="button" class="btn s x" onclick="addLine('${kind}')">+ إضافة صنف</button><div class="tot" id="tt">الإجمالي: 0</div></div>`;
}
function addLine(kind){
  const arr=kind==='prod'?'products':'materials';
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><select class="li" onchange="lp(this,'${kind}')"><option value="">اختر</option>${opts(arr)}</select></td><td><input class="lq" type="number" step="any" value="1" oninput="calcT()"></td><td><input class="lp" type="number" step="any" value="0" oninput="calcT()"></td><td class="lt">0</td><td><button type="button" class="btn d x" onclick="this.closest('tr').remove();calcT()">✕</button></td>`;
  document.getElementById('ln').appendChild(tr);
}
function lp(s,kind){const it=by(kind==='prod'?'products':'materials',s.value);s.closest('tr').querySelector('.lp').value=kind==='prod'?n(it.price):n(it.cost);calcT()}
function readLines(){return [...document.querySelectorAll('#ln tr')].slice(1).map(tr=>({item:tr.querySelector('.li').value,qty:n(tr.querySelector('.lq').value),price:n(tr.querySelector('.lp').value)})).filter(l=>l.item&&l.qty>0)}
function calcT(){let t=0;document.querySelectorAll('#ln tr').forEach((tr,i)=>{if(!i)return;const v=n(tr.querySelector('.lq').value)*n(tr.querySelector('.lp').value);tr.querySelector('.lt').textContent=f(v);t+=v});
  const d=n(document.querySelector('[name=disc]')?.value);document.getElementById('tt').textContent='الإجمالي: '+f(t-d);
  const pt=document.querySelector('[name=paytype]');if(pt&&pt.value==='full')document.querySelector('[name=paid]').value=Math.round((t-d)*100)/100}

// ================== VIEWS ==================
const V={};
V.dash=()=>{
  const cash=S.accounts.filter(a=>a.type==='cash').reduce((a,x)=>a+accBal(x.id),0);
  const bank=S.accounts.filter(a=>a.type==='bank').reduce((a,x)=>a+accBal(x.id),0);
  const ym=today().slice(0,7);
  const ms=S.sales.filter(s=>s.date.startsWith(ym)).reduce((a,s)=>a+n(s.total),0);
  const matVal=S.materials.reduce((a,m)=>a+stock('mat',m.id)*n(m.cost),0);
  const prVal=S.products.reduce((a,p)=>a+stock('prod',p.id)*prodCost(p),0);
  const rec=S.customers.reduce((a,c)=>a+Math.max(0,custBal(c.id)),0);
  const pay=S.suppliers.reduce((a,c)=>a+Math.max(0,suppBal(c.id)),0);
  const cus=S.custody.reduce((a,c)=>a+custodyOpen(c),0);
  const dep=S.machines.reduce((a,m)=>a+(depAccum(m)<n(m.cost)-n(m.salvage)?depMonthly(m):0),0);
  const low=S.materials.filter(m=>stock('mat',m.id)<n(m.min));
  return `<h2>لوحة التحكم</h2><div class="cards">
  ${[['رصيد الخزنة',cash],['رصيد البنك',bank],['مبيعات الشهر',ms],['قيمة مخزون الخامات',matVal],['قيمة المنتج التام',prVal],['مستحق على العملاء',rec],['مستحق للموردين',pay],['عُهد مفتوحة',cus],['إهلاك الآلات الشهري',dep]].map(([l,v])=>`<div class="card"><div class="l">${l}</div><div class="v ${v<0?'neg':''}">${f(v)}</div></div>`).join('')}</div>
  <div class="box"><h3>⚠️ خامات تحت حد الطلب</h3>${table(['الخامة','الرصيد','حد الطلب'],low.map(m=>[esc(m.name),f(stock('mat',m.id))+' '+esc(m.unit),f(m.min)]),'كل الخامات فوق حد الطلب ✓')}</div>
  <div class="box"><h3>آخر الحركات النقدية</h3>${table(['التاريخ','الحساب','البيان','المبلغ'],S.txns.slice(-8).reverse().map(t=>[t.date,nm('accounts',t.acc),esc(t.note),`<span class="${t.amt<0?'neg':'pos'}">${f(t.amt)}</span>`]))}</div>`;
};

// ---------- SALES ----------
V.sales=()=>`<h2>المبيعات</h2><div class="box"><h3>فواتير البيع <button class="btn" onclick="newSale()">+ فاتورة بيع</button></h3>
${table(['رقم','التاريخ','العميل','الإجمالي','المدفوع','الطريقة','الربح التقديري',''],S.sales.slice().reverse().map(s=>{const cost=s.lines.reduce((a,l)=>a+n(l.cost)*n(l.qty),0);return [s.no,s.date,nm('customers',s.party),f(s.total),f(s.paid),s.paid>=s.total?'<span class="tag g">نقدي</span>':s.paid>0?'<span class="tag a">جزئي</span>':'<span class="tag r">آجل</span>',f(s.total-cost),`<button class="btn s x" onclick="viewInv('sales','${s.id}')">عرض</button> <button class="btn d x" onclick="del('sales','${s.id}',()=>unlinkRef('${s.id}'))">حذف</button>`]}))}</div>`;
function newSale(){
  modal('فاتورة بيع جديدة',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('party','العميل',opts('customers'))}
  ${linesEditor('prod')}${fld('disc','خصم','number',0,'oninput="calcT()"')}
  ${sel('paytype','طريقة الدفع','<option value="full">نقدي بالكامل</option><option value="part">دفعة جزئية</option><option value="credit">آجل</option>','onchange="calcT()"')}
  ${sel('acc','حساب التحصيل',accOpts())}${fld('paid','المبلغ المدفوع','number',0)}${fld('note','ملاحظات','textarea')}</div>`,d=>{
    const lines=readLines();if(!lines.length){alert('أضف صنف واحد على الأقل');return false}
    for(const l of lines){const st=stock('prod',l.item);if(st<l.qty&&!confirm(`رصيد "${by('products',l.item).name}" = ${f(st)} أقل من الكمية المطلوبة. متابعة؟`))return false}
    const id=uid(),no=S.sales.length+1;lines.forEach(l=>l.cost=prodCost(by('products',l.item)));
    const total=lines.reduce((a,l)=>a+l.qty*l.price,0)-n(d.disc);
    const paid=d.paytype==='credit'?0:Math.min(n(d.paid),total);
    S.sales.push({id,no,date:d.date,party:d.party,lines,disc:n(d.disc),total,paid,note:d.note});
    lines.forEach(l=>S.moves.push({id:uid(),date:d.date,kind:'prod',item:l.item,qty:-l.qty,reason:'بيع فاتورة '+no,ref:id}));
    if(paid>0)S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:paid,cat:'تحصيل مبيعات',note:'تحصيل فاتورة بيع '+no,party:'c:'+d.party,ref:id});
  });addLine('prod');calcT();
}
function viewInv(arr,id){const s=by(arr,id);const ia=arr==='sales'?'products':'materials';
  modal(`فاتورة ${arr==='sales'?'بيع':'شراء'} رقم ${s.no}`,`<p>التاريخ: ${s.date} — ${arr==='sales'?'العميل':'المورد'}: ${nm(arr==='sales'?'customers':'suppliers',s.party)}</p>
  ${table(['الصنف','الكمية','السعر','الإجمالي'],s.lines.map(l=>[nm(ia,l.item),f(l.qty),f(l.price),f(l.qty*l.price)]))}
  <p class="tot">الخصم: ${f(s.disc)} — الإجمالي: ${f(s.total)} — المدفوع: ${f(s.paid)} — المتبقي: ${f(s.total-s.paid)}</p><p class="muted">${esc(s.note)}</p>`,()=>{window.print();return false},'🖨 طباعة')}

// ---------- PURCHASES ----------
V.purch=()=>`<h2>المشتريات</h2><div class="box"><h3>فواتير شراء الخامات <button class="btn" onclick="newPurch()">+ فاتورة شراء</button></h3>
${table(['رقم','التاريخ','المورد','الإجمالي','المدفوع','المتبقي',''],S.purchases.slice().reverse().map(s=>[s.no,s.date,nm('suppliers',s.party),f(s.total),f(s.paid),f(s.total-s.paid),`<button class="btn s x" onclick="viewInv('purchases','${s.id}')">عرض</button> <button class="btn d x" onclick="del('purchases','${s.id}',()=>unlinkRef('${s.id}'))">حذف</button>`]))}</div>`;
function newPurch(){
  modal('فاتورة شراء خامات',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('party','المورد',opts('suppliers'))}
  ${linesEditor('mat')}${fld('disc','خصم','number',0,'oninput="calcT()"')}
  ${sel('paytype','طريقة الدفع','<option value="full">نقدي بالكامل</option><option value="part">دفعة جزئية</option><option value="credit">آجل</option>','onchange="calcT()"')}
  ${sel('acc','حساب الدفع',accOpts())}${fld('paid','المبلغ المدفوع','number',0)}${fld('note','ملاحظات','textarea')}</div>`,d=>{
    const lines=readLines();if(!lines.length){alert('أضف خامة واحدة على الأقل');return false}
    const id=uid(),no=S.purchases.length+1;
    const total=lines.reduce((a,l)=>a+l.qty*l.price,0)-n(d.disc);
    const paid=d.paytype==='credit'?0:Math.min(n(d.paid),total);
    lines.forEach(l=>{const m=by('materials',l.item),st=Math.max(0,stock('mat',l.item));m.cost=(st*n(m.cost)+l.qty*l.price)/(st+l.qty)||l.price}); // متوسط مرجح
    S.purchases.push({id,no,date:d.date,party:d.party,lines,disc:n(d.disc),total,paid,note:d.note});
    lines.forEach(l=>S.moves.push({id:uid(),date:d.date,kind:'mat',item:l.item,qty:l.qty,reason:'شراء فاتورة '+no,ref:id}));
    if(paid>0)S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:-paid,cat:'سداد موردين',note:'سداد فاتورة شراء '+no,party:'s:'+d.party,ref:id});
  });addLine('mat');calcT();
}

// ---------- PRODUCTION ----------
V.prod=()=>`<h2>الإنتاج</h2><div class="box"><h3>أوامر التشغيل <button class="btn" onclick="newProd()">+ أمر إنتاج</button></h3>
<p class="muted">عند تسجيل أمر الإنتاج يتم صرف الخامات تلقائياً حسب مكونات المنتج (BOM) وإضافة المنتج التام للمخزن.</p>
${table(['التاريخ','المنتج','الكمية (زوج)','تكلفة الزوج','إجمالي التكلفة',''],S.production.slice().reverse().map(p=>[p.date,nm('products',p.item),f(p.qty),f(p.unit),f(p.unit*p.qty),`<button class="btn d x" onclick="del('production','${p.id}',()=>unlinkRef('${p.id}'))">حذف</button>`]))}</div>`;
function newProd(){
  modal('أمر إنتاج',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('item','المنتج',opts('products'))}${fld('qty','الكمية (زوج)','number',100)}${fld('extra','تكلفة عمالة/تشغيل إضافية للزوج','number',0)}</div>`,d=>{
    const p=by('products',d.item),q=n(d.qty);if(q<=0)return false;
    const short=(p.bom||[]).filter(b=>stock('mat',b.m)<b.q*q).map(b=>`${by('materials',b.m).name}: مطلوب ${f(b.q*q)} المتاح ${f(stock('mat',b.m))}`);
    if(short.length&&!confirm('خامات غير كافية:\n'+short.join('\n')+'\nمتابعة رغم ذلك؟'))return false;
    const id=uid(),unit=prodCost(p)+n(d.extra);
    S.production.push({id,date:d.date,item:d.item,qty:q,unit});
    (p.bom||[]).forEach(b=>S.moves.push({id:uid(),date:d.date,kind:'mat',item:b.m,qty:-b.q*q,reason:'صرف للإنتاج - '+p.name,ref:id}));
    S.moves.push({id:uid(),date:d.date,kind:'prod',item:d.item,qty:q,reason:'إنتاج تام',ref:id});
  });
}

// ---------- ITEMS ----------
V.items=()=>{const t=sub.items||'p';return `<h2>المنتجات والخامات</h2><div class="sub"><a class="${t==='p'?'on':''}" onclick="sub.items='p';render()">المنتجات ومكوناتها</a><a class="${t==='m'?'on':''}" onclick="sub.items='m';render()">الخامات</a></div>`+(t==='p'?
`<div class="box"><h3>المنتجات <button class="btn" onclick="editProd()">+ منتج</button></h3>${table(['الكود','المنتج','سعر البيع','تكلفة الخامات','هامش الربح','الرصيد',''],S.products.map(p=>{const c=prodCost(p);return [esc(p.code),esc(p.name),f(p.price),f(c),f(p.price-c)+` (${p.price?Math.round((p.price-c)/p.price*100):0}%)`,f(stock('prod',p.id)),`<button class="btn s x" onclick="editProd('${p.id}')">تعديل</button> <button class="btn d x" onclick="del('products','${p.id}')">حذف</button>`]}))}</div>`:
`<div class="box"><h3>الخامات <button class="btn" onclick="editMat()">+ خامة</button></h3>${table(['الخامة','الوحدة','متوسط التكلفة','حد الطلب','الرصيد','القيمة',''],S.materials.map(m=>{const s=stock('mat',m.id);return [esc(m.name),esc(m.unit),f(m.cost),f(m.min),`<span class="${s<m.min?'neg':''}">${f(s)}</span>`,f(s*m.cost),`<button class="btn s x" onclick="editMat('${m.id}')">تعديل</button> <button class="btn d x" onclick="del('materials','${m.id}')">حذف</button>`]}))}</div>`)};
function editMat(id){const m=id?by('materials',id):{};modal(id?'تعديل خامة':'خامة جديدة',`<div class="fg">${fld('name','اسم الخامة','text',m.name||'','required')}${fld('unit','الوحدة','text',m.unit||'متر')}${fld('cost','التكلفة','number',m.cost||0)}${fld('min','حد الطلب','number',m.min||0)}${id?'':fld('open','رصيد افتتاحي','number',0)}</div>`,d=>{
  if(id)Object.assign(m,{name:d.name,unit:d.unit,cost:n(d.cost),min:n(d.min)});else{const nid=uid();S.materials.push({id:nid,name:d.name,unit:d.unit,cost:n(d.cost),min:n(d.min)});if(n(d.open))S.moves.push({id:uid(),date:today(),kind:'mat',item:nid,qty:n(d.open),reason:'رصيد افتتاحي'})}})}
function editProd(id){const p=id?by('products',id):{bom:[]};
  modal(id?'تعديل منتج':'منتج جديد',`<div class="fg">${fld('code','الكود','text',p.code||'')}${fld('name','اسم المنتج','text',p.name||'','required')}${fld('price','سعر البيع','number',p.price||0)}
  <div class="f full"><label>مكونات الزوج الواحد (BOM)</label><table class="lines" id="bm"><tr><th>الخامة</th><th>الكمية</th><th></th></tr>${(p.bom||[]).map(b=>bomRow(b)).join('')}</table><button type="button" class="btn s x" onclick="document.getElementById('bm').insertAdjacentHTML('beforeend',bomRow({}))">+ خامة</button></div></div>`,d=>{
    const bom=[...document.querySelectorAll('#bm tr')].slice(1).map(tr=>({m:tr.querySelector('select').value,q:n(tr.querySelector('input').value)})).filter(b=>b.m&&b.q>0);
    if(id)Object.assign(p,{code:d.code,name:d.name,price:n(d.price),bom});else S.products.push({id:uid(),code:d.code,name:d.name,price:n(d.price),bom})})}
const bomRow=b=>`<tr><td><select><option value="">اختر</option>${opts('materials',b.m)}</select></td><td><input type="number" step="any" value="${b.q||''}"></td><td><button type="button" class="btn d x" onclick="this.closest('tr').remove()">✕</button></td></tr>`;

  ${fk?`<select onchange="sub.si=this.value;render()">${opts(fk==='mat'?'materials':'products',fi,'كل الأصناف')}</select>`:''}</div>
  ${table(['التاريخ','النوع','الصنف','وارد','منصرف','البيان'],mv.map(m=>[m.date,m.kind==='mat'?'خامة':'منتج',nm(m.kind==='mat'?'materials':'products',m.item),m.qty>0?`<span class="pos">${f(m.qty)}</span>`:'',m.qty<0?`<span class="neg">${f(-m.qty)}</span>`:'',esc(m.reason)]))}</div>`};
function newMove(){modal('حركة مخزن يدوية',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('kind','النوع','<option value="mat">خامة</option><option value="prod">منتج تام</option>',`onchange="this.form.item.innerHTML=this.value==='mat'?S.materials.map(x=>'<option value='+x.id+'>'+x.name+'</option>').join(''):S.products.map(x=>'<option value='+x.id+'>'+x.name+'</option>').join('')"`)}
  ${sel('item','الصنف',opts('materials'))}${sel('dir','الاتجاه','<option value="1">إضافة (وارد)</option><option value="-1">صرف (منصرف)</option>')}${fld('qty','الكمية','number',0)}${fld('reason','البيان (هالك/جرد/مرتجع...)','text','تسوية جرد')}</div>`,
  d=>{if(!n(d.qty))return false;S.moves.push({id:uid(),date:d.date,kind:d.kind,item:d.item,qty:n(d.qty)*n(d.dir),reason:d.reason})})}

// ---------- CASH & BANK ----------
const CATS_IN=['تحصيل من عميل','إيراد آخر','إيداع رأس مال'],CATS_OUT=['سداد لمورد','رواتب وأجور','إيجار','كهرباء ومياه','نقل وشحن','مصروفات إدارية','مصروفات أخرى','مسحوبات شخصية'];
V.cash=()=>{const fa=sub.ca||'';const tx=S.txns.filter(t=>!fa||t.acc===fa);let run=fa?n(by('accounts',fa).open):0;
  const rows=tx.map(t=>{run+=n(t.amt);return [t.date,nm('accounts',t.acc),esc(t.cat),esc(t.note),t.amt>0?`<span class="pos">${f(t.amt)}</span>`:'',t.amt<0?`<span class="neg">${f(-t.amt)}</span>`:'',fa?f(run):'',t.ref?'<span class="muted">تلقائي</span>':`<button class="btn d x" onclick="del('txns','${t.id}',()=>{S.txns=S.txns.filter(x=>x.ref!=='${t.id}')})">حذف</button>`]}).reverse();
  return `<h2>الخزنة والبنك</h2><div class="cards">${S.accounts.map(a=>`<div class="card"><div class="l">${a.type==='cash'?'💵':'🏦'} ${esc(a.name)}</div><div class="v ${accBal(a.id)<0?'neg':''}">${f(accBal(a.id))}</div></div>`).join('')}</div>
  <div class="box"><h3>الحركات النقدية <span class="bar"><button class="btn" onclick="newTx(1)">+ قبض</button><button class="btn d" onclick="newTx(-1)">− صرف</button><button class="btn s" onclick="newTransfer()">⇄ تحويل</button><button class="btn s" onclick="newAcc()">+ حساب</button></span></h3>
  <div class="filters"><select onchange="sub.ca=this.value;render()"><option value="">كل الحسابات</option>${S.accounts.map(a=>`<option value="${a.id}" ${a.id===fa?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
  ${table(['التاريخ','الحساب','البند','البيان','قبض','صرف',fa?'الرصيد':'',''],rows)}</div>`};
function newTx(dir){
  const cats=dir>0?CATS_IN:CATS_OUT;
  modal(dir>0?'سند قبض':'سند صرف',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('acc','الحساب',accOpts())}${sel('cat','البند',cats.map(c=>`<option>${c}</option>`).join(''))}
  ${sel('party','الطرف (اختياري)','<option value="">—</option>'+S.customers.map(c=>`<option value="c:${c.id}">عميل: ${esc(c.name)}</option>`).join('')+S.suppliers.map(c=>`<option value="s:${c.id}">مورد: ${esc(c.name)}</option>`).join(''))}
  ${fld('amt','المبلغ','number',0,'required')}${fld('note','البيان','text')}</div>`,d=>{if(n(d.amt)<=0)return false;S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:n(d.amt)*dir,cat:d.cat,note:d.note||d.cat,party:d.party})})}
function newTransfer(){modal('تحويل بين الحسابات (مثلاً إيداع الخزنة في البنك)',`<div class="fg">${fld('date','التاريخ','date',today())}${fld('amt','المبلغ','number',0)}${sel('from','من',accOpts())}${sel('to','إلى',accOpts(S.accounts[1]?.id))}</div>`,d=>{
  if(d.from===d.to||n(d.amt)<=0)return false;const id=uid();
  S.txns.push({id,date:d.date,acc:d.from,amt:-n(d.amt),cat:'تحويل',note:'تحويل إلى '+by('accounts',d.to).name},{id:uid(),date:d.date,acc:d.to,amt:n(d.amt),cat:'تحويل',note:'تحويل من '+by('accounts',d.from).name,ref:id})})}
function newAcc(){modal('حساب جديد',`<div class="fg">${fld('name','اسم الحساب','text','','required')}${sel('type','النوع','<option value="cash">خزنة</option><option value="bank">بنك</option>')}${fld('open','رصيد افتتاحي','number',0)}</div>`,d=>{S.accounts.push({id:uid(),name:d.name,type:d.type,open:n(d.open)})})}

// ---------- CUSTODY ----------
V.cust=()=>`<h2>العُهد</h2><div class="box"><h3>العُهد النقدية <span class="bar"><button class="btn" onclick="newCustody()">+ صرف عهدة</button><button class="btn s" onclick="newEmp()">+ موظف</button></span></h3>
${table(['التاريخ','الموظف','الغرض','المبلغ','المصروف','المرتجع','المتبقي','الحالة',''],S.custody.slice().reverse().map(c=>{const st=S.settle.filter(s=>s.cid===c.id),sp=st.reduce((a,s)=>a+n(s.spent),0),rt=st.reduce((a,s)=>a+n(s.ret),0),o=custodyOpen(c);
  return [c.date,nm('employees',c.emp),esc(c.purpose),f(c.amt),f(sp),f(rt),f(o),o>0.001?'<span class="tag a">مفتوحة</span>':'<span class="tag g">مسوّاة</span>',`${o>0.001?`<button class="btn x" onclick="settleC('${c.id}')">تسوية</button> `:''}<button class="btn d x" onclick="del('custody','${c.id}',()=>{S.settle.filter(s=>s.cid==='${c.id}').forEach(s=>unlinkRef(s.id));S.settle=S.settle.filter(s=>s.cid!=='${c.id}');unlinkRef('${c.id}')})">حذف</button>`]}))}</div>
<div class="box"><h3>أرصدة العُهد حسب الموظف</h3>${table(['الموظف','إجمالي العُهد المفتوحة'],S.employees.map(e=>[esc(e.name),f(S.custody.filter(c=>c.emp===e.id).reduce((a,c)=>a+custodyOpen(c),0))]))}</div>`;
function newEmp(){modal('موظف جديد',`<div class="fg">${fld('name','الاسم','text','','required')}${fld('job','الوظيفة','text')}</div>`,d=>{S.employees.push({id:uid(),name:d.name,job:d.job})})}
function newCustody(){modal('صرف عهدة',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('emp','الموظف',opts('employees'))}${sel('acc','من حساب',accOpts())}${fld('amt','المبلغ','number',0)}${fld('purpose','الغرض','text','مشتريات نثرية')}</div>`,d=>{
  if(n(d.amt)<=0)return false;const id=uid();S.custody.push({id,date:d.date,emp:d.emp,acc:d.acc,amt:n(d.amt),purpose:d.purpose});
  S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:-n(d.amt),cat:'صرف عهدة',note:'عهدة: '+by('employees',d.emp).name+' - '+d.purpose,ref:id})})}
function settleC(cid){const c=by('custody',cid);modal('تسوية عهدة — المتبقي '+f(custodyOpen(c)),`<div class="fg">${fld('date','التاريخ','date',today())}${fld('spent','المصروف بمستندات','number',0)}${sel('cat','بند المصروف',CATS_OUT.map(x=>`<option>${x}</option>`).join(''))}${fld('ret','المبلغ المرتجع نقداً','number',0)}${sel('acc','يرد إلى حساب',accOpts(c.acc))}${fld('note','ملاحظات','text')}</div>`,d=>{
  if(n(d.spent)+n(d.ret)>custodyOpen(c)+0.001){alert('المبلغ أكبر من المتبقي في العهدة');return false}const id=uid();
  S.settle.push({id,cid,date:d.date,spent:n(d.spent),ret:n(d.ret),cat:d.cat,note:d.note});
  if(n(d.ret)>0)S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:n(d.ret),cat:'رد عهدة',note:'مرتجع عهدة '+by('employees',c.emp).name,ref:id})})}

// ---------- MACHINES ----------
V.mach=()=>{const t=sub.mt||'a';return `<h2>الآلات والماكينات</h2><div class="sub"><a class="${t==='a'?'on':''}" onclick="sub.mt='a';render()">الآلات والإهلاك</a><a class="${t==='b'?'on':''}" onclick="sub.mt='b';render()">الصيانة والأعطال</a></div>`+(t==='a'?
`<div class="box"><h3>سجل الآلات (إهلاك بطريقة القسط الثابت) <button class="btn" onclick="editMach()">+ آلة</button></h3>${table(['الآلة','تاريخ الشراء','التكلفة','الخردة','العمر (سنة)','الإهلاك الشهري','الإهلاك السنوي','مجمع الإهلاك','القيمة الدفترية','الصيانة',''],S.machines.map(m=>{const ac=depAccum(m);return [esc(m.name),m.date,f(m.cost),f(m.salvage),f(m.life),f(depMonthly(m)),f(depMonthly(m)*12),f(ac),f(n(m.cost)-ac),f(S.maint.filter(x=>x.mach===m.id).reduce((a,x)=>a+n(x.cost),0)),`<button class="btn s x" onclick="editMach('${m.id}')">تعديل</button> <button class="btn d x" onclick="del('machines','${m.id}')">حذف</button>`]}))}
<p class="muted">الإهلاك الشهري = (التكلفة − قيمة الخردة) ÷ (العمر الإنتاجي × 12)</p></div>`:
`<div class="box"><h3>سجل الصيانة والأعطال <button class="btn" onclick="newMaint()">+ تسجيل</button></h3>${table(['التاريخ','الآلة','النوع','الوصف','ساعات التوقف','التكلفة',''],S.maint.slice().reverse().map(x=>[x.date,nm('machines',x.mach),x.type==='عطل'?'<span class="tag r">عطل</span>':'<span class="tag">صيانة دورية</span>',esc(x.desc),f(x.hours),f(x.cost),`<button class="btn d x" onclick="del('maint','${x.id}',()=>unlinkRef('${x.id}'))">حذف</button>`]))}</div>`)};
function editMach(id){const m=id?by('machines',id):{};modal(id?'تعديل آلة':'آلة جديدة',`<div class="fg">${fld('name','اسم الآلة','text',m.name||'','required')}${fld('date','تاريخ الشراء/التشغيل','date',m.date||today())}${fld('cost','تكلفة الشراء','number',m.cost||0)}${fld('salvage','قيمة الخردة المتوقعة','number',m.salvage||0)}${fld('life','العمر الإنتاجي (سنوات)','number',m.life||10)}
  ${id?'':sel('acc','دفع ثمنها من (اختياري)','<option value="">لا يسجل دفع</option>'+accOpts())}</div>`,d=>{
  const v={name:d.name,date:d.date,cost:n(d.cost),salvage:n(d.salvage),life:n(d.life)};
  if(id)Object.assign(m,v);else{const nid=uid();S.machines.push({id:nid,...v});if(d.acc)S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:-v.cost,cat:'شراء أصول',note:'شراء آلة: '+d.name,ref:nid})}})}
function newMaint(){if(!S.machines.length){alert('أضف آلة أولاً');return}modal('تسجيل صيانة / عطل',`<div class="fg">${fld('date','التاريخ','date',today())}${sel('mach','الآلة',opts('machines'))}${sel('type','النوع','<option>صيانة دورية</option><option>عطل</option>')}${fld('hours','ساعات التوقف','number',0)}${fld('cost','التكلفة','number',0)}${sel('acc','دفع من',accOpts())}${fld('desc','الوصف','textarea')}</div>`,d=>{
  const id=uid();S.maint.push({id,date:d.date,mach:d.mach,type:d.type,hours:n(d.hours),cost:n(d.cost),desc:d.desc});
  if(n(d.cost)>0)S.txns.push({id:uid(),date:d.date,acc:d.acc,amt:-n(d.cost),cat:'صيانة آلات',note:d.type+': '+by('machines',d.mach).name,ref:id})})}

// ---------- PARTIES ----------
V.parties=()=>`<h2>العملاء والموردين</h2>
<div class="box"><h3>العملاء <button class="btn" onclick="editParty('customers')">+ عميل</button></h3>${table(['الاسم','الهاتف','إجمالي المبيعات','الرصيد المستحق',''],S.customers.map(c=>[esc(c.name),esc(c.phone),f(S.sales.filter(s=>s.party===c.id).reduce((a,s)=>a+n(s.total),0)),`<b class="${custBal(c.id)>0?'neg':''}">${f(custBal(c.id))}</b>`,`<button class="btn s x" onclick="stmt('c','${c.id}')">كشف حساب</button> <button class="btn s x" onclick="editParty('customers','${c.id}')">تعديل</button>`]))}</div>
<div class="box"><h3>الموردين <button class="btn" onclick="editParty('suppliers')">+ مورد</button></h3>${table(['الاسم','الهاتف','إجمالي المشتريات','المستحق له',''],S.suppliers.map(c=>[esc(c.name),esc(c.phone),f(S.purchases.filter(s=>s.party===c.id).reduce((a,s)=>a+n(s.total),0)),`<b class="${suppBal(c.id)>0?'neg':''}">${f(suppBal(c.id))}</b>`,`<button class="btn s x" onclick="stmt('s','${c.id}')">كشف حساب</button> <button class="btn s x" onclick="editParty('suppliers','${c.id}')">تعديل</button>`]))}</div>`;
function editParty(arr,id){const p=id?by(arr,id):{};modal(id?'تعديل':'إضافة',`<div class="fg">${fld('name','الاسم','text',p.name||'','required')}${fld('phone','الهاتف','text',p.phone||'')}${fld('open','رصيد افتتاحي (مستحق)','number',p.open||0)}</div>`,d=>{if(id)Object.assign(p,{name:d.name,phone:d.phone,open:n(d.open)});else S[arr].push({id:uid(),name:d.name,phone:d.phone,open:n(d.open)})})}
function stmt(t,id){const isC=t==='c',p=by(isC?'customers':'suppliers',id);let b=n(p.open);
  const ev=[...(isC?S.sales:S.purchases).filter(s=>s.party===id).map(s=>({date:s.date,d:'فاتورة '+s.no,dr:s.total,cr:0})),...S.txns.filter(x=>x.party===t+':'+id).map(x=>({date:x.date,d:x.note,dr:0,cr:Math.abs(x.amt)}))].sort((a,b)=>a.date.localeCompare(b.date));
  modal('كشف حساب: '+esc(p.name),table(['التاريخ','البيان',isC?'مدين (فواتير)':'دائن (فواتير)',isC?'دائن (تحصيل)':'مدين (سداد)','الرصيد'],[['','رصيد افتتاحي','','',f(b)],...ev.map(e=>{b+=e.dr-e.cr;return [e.date,esc(e.d),f(e.dr),f(e.cr),f(b)]})]),()=>{window.print();return false},'🖨 طباعة')}

// ---------- REPORTS ----------
V.reports=()=>{const fr=sub.rf||today().slice(0,8)+'01',to=sub.rt||today();const inP=d=>d>=fr&&d<=to;
  const sales=S.sales.filter(s=>inP(s.date)),rev=sales.reduce((a,s)=>a+n(s.total),0),cogs=sales.reduce((a,s)=>a+s.lines.reduce((x,l)=>x+n(l.cost)*n(l.qty),0),0);
  const exp={};S.txns.filter(t=>inP(t.date)&&t.amt<0&&CATS_OUT.concat(['صيانة آلات']).includes(t.cat)&&!['سداد لمورد','مسحوبات شخصية'].includes(t.cat)).forEach(t=>exp[t.cat]=(exp[t.cat]||0)-t.amt);
  S.settle.filter(s=>inP(s.date)&&n(s.spent)>0).forEach(s=>exp[s.cat+' (من العُهد)']=(exp[s.cat+' (من العُهد)']||0)+n(s.spent));
  const dep=S.machines.reduce((a,m)=>a+depInPeriod(m,fr,to),0);exp['إهلاك الآلات']=dep;
  const te=Object.values(exp).reduce((a,v)=>a+v,0),gp=rev-cogs;
  const bp={};sales.forEach(s=>s.lines.forEach(l=>{const k=l.item;bp[k]=bp[k]||{q:0,v:0,c:0};bp[k].q+=l.qty;bp[k].v+=l.qty*l.price;bp[k].c+=l.qty*n(l.cost)}));
  return `<h2>التقارير</h2><div class="filters">من <input type="date" value="${fr}" onchange="sub.rf=this.value;render()"> إلى <input type="date" value="${to}" onchange="sub.rt=this.value;render()"><button class="btn s" onclick="window.print()">🖨 طباعة</button></div>
  <div class="box"><h3>قائمة الدخل للفترة</h3>${table(['البند','المبلغ'],[['صافي المبيعات',f(rev)],['(−) تكلفة البضاعة المباعة',f(cogs)],['<b>مجمل الربح</b>',`<b>${f(gp)}</b>`],...Object.entries(exp).map(([k,v])=>['(−) '+esc(k),f(v)]),['<b>صافي الربح</b>',`<b class="${gp-te<0?'neg':'pos'}">${f(gp-te)}</b>`]])}
  <p class="muted">الإهلاك محسوب بالشهور الكاملة داخل الفترة. المشتريات لا تظهر كمصروف لأنها تتحول لمخزون ثم لتكلفة مبيعات.</p></div>
  <div class="box"><h3>المبيعات حسب المنتج</h3>${table(['المنتج','الكمية','المبيعات','التكلفة','الربح'],Object.entries(bp).map(([k,v])=>[nm('products',k),f(v.q),f(v.v),f(v.c),f(v.v-v.c)]))}</div>
  <div class="box"><h3>ملخص الإنتاج والحركة</h3>${table(['البيان','القيمة'],[['أزواج تم إنتاجها',f(S.production.filter(p=>inP(p.date)).reduce((a,p)=>a+p.qty,0))],['تكلفة الإنتاج',f(S.production.filter(p=>inP(p.date)).reduce((a,p)=>a+p.qty*p.unit,0))],['مشتريات خامات',f(S.purchases.filter(p=>inP(p.date)).reduce((a,p)=>a+p.total,0))],['ساعات توقف الآلات',f(S.maint.filter(m=>inP(m.date)).reduce((a,m)=>a+m.hours,0))]])}</div>`};

V.settings=()=>`<h2>النسخ الاحتياطي</h2><div class="box"><h3>البيانات</h3>
<p class="muted">البيانات محفوظة أونلاين على الخادم ومشتركة بين كل المستخدمين. تقدر تاخد نسخة كملف أو ترجع نسخة قديمة.</p>
<div class="bar"><button class="btn" onclick="exportData()">⬇ تصدير نسخة احتياطية</button><label class="btn s">⬆ استيراد نسخة<input type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn d" onclick="if(confirm('مسح كل البيانات والبدء من جديد ببيانات تجريبية؟ لا يمكن التراجع!')){lastAction='مسح كل البيانات';S=seed();save();render()}">مسح كل البيانات</button></div></div>`;
async function exportData(){const txt=JSON.stringify(S,null,1),name='shoe-factory-backup-'+today()+'.json';
  try{const d=await window.claude?.use?.('downloads');if(d){await d.save(new Blob([txt],{type:'application/json'}),{filename:name});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click()}
function importData(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.materials)throw 0;if(!confirm('استبدال كل البيانات الحالية بالنسخة دي؟'))return;lastAction='استيراد نسخة احتياطية';S=d;norm();save();render();alert('تم الاستيراد ✓')}catch(e){alert('ملف غير صالح')}};r.readAsText(i.files[0])}

V.account=()=>`<h2>حسابي</h2><div class="box"><h3>${esc(U.full_name||U.username)} <span class="tag">${U.role==='admin'?'مدير النظام':'مستخدم'}</span></h3>
<p class="muted">اسم المستخدم: ${esc(U.username)}</p><button class="btn" onclick="changePass()">تغيير كلمة المرور</button></div>`;
function changePass(){modal('تغيير كلمة المرور',`<div class="fg">${fld('o','كلمة المرور الحالية','password')}${fld('n1','الجديدة','password')}${fld('n2','تأكيد الجديدة','password')}</div>`,d=>{
  if(d.n1!==d.n2){alert('كلمتا المرور غير متطابقتين');return false}
  rpc('app_change_password',{p_token:U.token,p_old:d.o,p_new:d.n1}).then(()=>alert('تم تغيير كلمة المرور ✓')).catch(e=>alert(e.message));closeM();return false})}

// ---------- USERS (admin) ----------
let USERS=[],LOG=[];
V.users=()=>{if(!USERS.length&&!V.users.loading){V.users.loading=1;Promise.all([rpc('app_users_list',{p_token:U.token}),rpc('app_log_list',{p_token:U.token})]).then(([a,b])=>{USERS=a;LOG=b;V.users.loading=0;render()}).catch(e=>{V.users.loading=0;alert(e.message)})}
  const pn=k=>PAGES.find(p=>p[0]===k)?.[1]||k;
  return `<h2>المستخدمين والصلاحيات</h2><div class="box"><h3>المستخدمين <span class="bar"><button class="btn" onclick="editUser()">+ مستخدم جديد</button><button class="btn s" onclick="USERS=[];render()">⟳</button></span></h3>
  ${table(['اسم المستخدم','الاسم','النوع','الأقسام المسموحة','الحالة',''],USERS.map(u=>[esc(u.username),esc(u.full_name),u.role==='admin'?'<span class="tag">مدير</span>':'مستخدم',u.role==='admin'?'الكل':u.pages.map(pn).join('، ')||'—',u.active?'<span class="tag g">نشط</span>':'<span class="tag r">موقوف</span>',`<button class="btn s x" onclick="editUser('${u.id}')">تعديل</button>`]),V.users.loading?'جاري التحميل...':'لا يوجد')}</div>
  <div class="box"><h3>سجل النشاط (آخر 200 عملية)</h3>${table(['الوقت','المستخدم','العملية'],LOG.map(l=>[new Date(l.at).toLocaleString('ar-EG'),esc(l.username),esc(l.action)]))}</div>`};
function editUser(id){const u=id?USERS.find(x=>x.id===id):{role:'user',pages:[],active:true};
  modal(id?'تعديل مستخدم':'مستخدم جديد',`<div class="fg">${fld('username','اسم المستخدم (للدخول)','text',u.username||'','required')}${fld('full_name','الاسم الكامل','text',u.full_name||'')}
  ${fld('password',id?'كلمة مرور جديدة (اتركها فاضية لو مش هتغيرها)':'كلمة المرور (6 أحرف على الأقل)','text','')}
  ${sel('role','النوع',`<option value="user" ${u.role==='user'?'selected':''}>مستخدم (أقسام محددة)</option><option value="admin" ${u.role==='admin'?'selected':''}>مدير النظام (كل الصلاحيات)</option>`)}
  ${sel('active','الحالة',`<option value="1" ${u.active?'selected':''}>نشط</option><option value="0" ${!u.active?'selected':''}>موقوف</option>`)}
  <div class="f full"><label>الأقسام المسموح بها (للمستخدم العادي)</label><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px">${PAGES.map(([k,l])=>`<label style="color:var(--tx)"><input type="checkbox" name="pg_${k}" ${u.pages.includes(k)?'checked':''}> ${l}</label>`).join('')}</div></div></div>`,d=>{
    const pages=PAGES.map(p=>p[0]).filter(k=>d['pg_'+k]);
    rpc('app_user_save',{p_token:U.token,p_id:id||null,p_username:d.username,p_full_name:d.full_name,p_password:d.password,p_role:d.role,p_pages:pages,p_active:d.active==='1'})
      .then(()=>{USERS=[];closeM();render()}).catch(e=>alert(e.message.includes('duplicate')?'اسم المستخدم موجود بالفعل':e.message));return false})}

if(U)start();else showLogin();
</script>
